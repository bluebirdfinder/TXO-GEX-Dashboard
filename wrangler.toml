name = "taifex-gex-proxy"
main = "cloudflare/worker.js"
compatibility_date = "2026-08-05"

[vars]
ALLOWED_ORIGIN = "https://bluebirdfinder.github.io"
FUBON_API_BASE_URL = "https://your-fubon-api-base-url"
FUBON_QUOTE_PATH = "/quote"

# Put sensitive values in Cloudflare Worker secrets instead of source control.
# Example secrets to create in Cloudflare Dashboard:
#   PRIVATE_ACCESS_TOKEN
#   FUBON_AUTH_HEADER
#   FUBON_API_TOKEN
#   FUBON_API_KEY
#   FUBON_API_SECRET
