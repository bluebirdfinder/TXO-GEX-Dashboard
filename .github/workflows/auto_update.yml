name: TAIFEX Data Engine (Day & Night Sessions)

on:
  schedule:
    # --- 🌙 Night Session Settlement Window (05:00, 05:30, 06:00 TWD) ---
    - cron: '0 21 * * 0-4'   # 05:00 TWD (Night Session Close Attempt 1)
    - cron: '30 21 * * 0-4'  # 05:30 TWD (Night Session Settlement & Card Generation)
    - cron: '0 22 * * 0-4'   # 06:00 TWD (Night Session Failover Retry)

    # --- ☀️ Day Session Settlement & Institutional Chips Window (15:00, 15:30, 16:00 TWD) ---
    - cron: '0 7 * * 1-5'    # 15:00 TWD (Day Session Close Attempt 1)
    - cron: '30 7 * * 1-5'   # 15:30 TWD (Primary Day Settlement, Chips & Card Generation)
    - cron: '0 8 * * 1-5'    # 16:00 TWD (Day Session Failover Retry)

  workflow_dispatch: # Allows 1-click manual trigger from GitHub UI anytime on phone or PC

# Grant GITHUB_TOKEN write access to repository contents for automated commits
permissions:
  contents: write

jobs:
  update-official-taifex-positioning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests playwright google-genai
          playwright install chromium --with-deps

      - name: Fetch Official TAIFEX Positioning & Vision Data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_and_calc_vision.py
          python scratch/make_embedded_data_js.py

      - name: Commit and Push Official Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gex_data.json data/encrypted_gex.json data/embedded_data.js
          git status
          git diff-index --quiet HEAD || (git commit -m "🏛️ [Official] TAIFEX Day/Night Session Positioning & GEX Baseline [skip ci]" && git push)
