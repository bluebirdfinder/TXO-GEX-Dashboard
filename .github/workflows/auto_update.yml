name: TAIFEX Data Engine (Day & Night Sessions)

on:
  schedule:
    # --- 🌙 Night Session Settlement Window (05:00 Close -> 05:30, 06:00, 06:30 TWD) ---
    - cron: '30 21 * * 0-4'  # 05:30 TWD (Primary Night Settlement & Card Generation)
    - cron: '0 22 * * 0-4'   # 06:00 TWD (Failover Retry 1)
    - cron: '30 22 * * 0-4'  # 06:30 TWD (Failover Retry 2)

    # --- ☀️ Day Session Settlement & Institutional Chips Window (13:45 Close -> 15:30, 16:00, 16:30 TWD) ---
    - cron: '30 7 * * 1-5'   # 15:30 TWD (Primary Day Settlement, Chips & Card Generation)
    - cron: '0 8 * * 1-5'    # 16:00 TWD (Failover Retry 1)
    - cron: '30 8 * * 1-5'   # 16:30 TWD (Failover Retry 2)

  workflow_dispatch: # Allows 1-click manual trigger from GitHub UI anytime on phone or PC

# Grant GITHUB_TOKEN write access to repository contents for automated commits
permissions:
  contents: write

jobs:
  update-official-taifex-positioning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests playwright google-genai
          playwright install chromium --with-deps

      - name: Fetch Official TAIFEX Positioning & Vision Data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_and_calc_vision.py
          python scratch/make_embedded_data_js.py

      - name: Commit and Push Official Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gex_data.json data/encrypted_gex.json data/embedded_data.js
          git status
          git diff-index --quiet HEAD || (git commit -m "🏛️ [Official] TAIFEX Day/Night Session Positioning & GEX Baseline [skip ci]" && git push)
