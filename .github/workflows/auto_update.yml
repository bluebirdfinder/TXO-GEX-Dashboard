name: TAIFEX Data Engine (Day & Night Sessions)

on:
  schedule:
    # --- 🌙 Night Session Settlement Window (05:03, 05:33, 06:03 TWD) ---
    - cron: '3 21 * * 0-4'   # 05:03 TWD (Night Session Close Attempt 1)
    - cron: '33 21 * * 0-4'  # 05:33 TWD (Night Session Settlement & Card Generation)
    - cron: '3 22 * * 0-4'   # 06:03 TWD (Night Session Failover Retry)

    # --- ☀️ Day Session Settlement & Institutional Chips Window (15:03, 15:33, 16:03 TWD) ---
    - cron: '3 7 * * 1-5'    # 15:03 TWD (Day Session Close Attempt 1)
    - cron: '33 7 * * 1-5'   # 15:33 TWD (Primary Day Settlement, Chips & Card Generation)
    - cron: '3 8 * * 1-5'    # 16:03 TWD (Day Session Failover Retry)

    # --- 📈 TWSE Evening Margin Maintenance Ratio Window (21:03, 21:33, 22:03 TWD) ---
    - cron: '3 13 * * 1-5'   # 21:03 TWD (TWSE Margin Maintenance Ratio Release)
    - cron: '33 13 * * 1-5'  # 21:33 TWD (Margin Maintenance Ratio Retry 1)
    - cron: '3 14 * * 1-5'   # 22:03 TWD (Margin Maintenance Ratio Safety Retry 2)

  workflow_dispatch: # Allows 1-click manual trigger from GitHub UI anytime on phone or PC

# Grant GITHUB_TOKEN write access to repository contents for automated commits
permissions:
  contents: write

# Only one run at a time: the on-time Worker trigger and GitHub's own (late) cron can
# overlap. Queue instead of cancelling so a run that is mid-fetch is never killed.
concurrency:
  group: taifex-data-engine
  cancel-in-progress: false

jobs:
  update-official-taifex-positioning:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests playwright google-genai
          playwright install chromium --with-deps

      - name: Fetch Official TAIFEX Positioning & Vision Data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_and_calc_vision.py

      - name: Fetch Multi-Timeframe Market K-Lines (Trading Room)
        # Found 2026-09-16: this script was never wired into any schedule, so
        # data/klines_cache.json (real K-line candles behind 尋鳥戰情室's charts and, now,
        # the ADX MTF Cloudflare Worker) had gone stale for days between manual runs.
        # Piggybacks on this same cron window rather than a separate schedule.
        run: |
          python scripts/fetch_market_klines.py

      - name: Fetch Real Daily Stock Quotes (TWSE/TPEx OpenAPI)
        # 2026-10-07 實測發現：data/tw_quotes_latest.json（戰情室個股報價、選股雷達價格）完全沒有排程，
        # 只在有人手動跑時才更新，曾經 13 天沒動。搭同一個 cron 視窗順便更新；失敗不影響主流程。
        continue-on-error: true
        run: |
          python scripts/fetch_real_quotes.py

      - name: Commit and Push Official Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gex_data.json data/encrypted_gex.json data/embedded_data.js data/social_card_*.png data/klines_cache.json data/tw_quotes_latest.json data/session_snapshots.json data/institutional_snapshots.json data/gex_line_observations.json
          git status
          if git diff-index --quiet HEAD; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "🏛️ [Official] TAIFEX Day/Night Session Positioning & GEX Baseline"
          # main moves while this job runs (CI data commits, manual pushes). Retry with
          # rebase; a real conflict makes the rebase fail and the job fail loudly.
          # Uncommitted leftovers (caches the job does not commit) make `git pull --rebase` refuse to run
          # (seen 2026-10-02 22:03); the runner is ephemeral, so set them aside first.
          git stash --include-untracked || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $i/5); rebasing onto origin/main"
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          done
          echo "Push failed after 5 attempts"
          exit 1
